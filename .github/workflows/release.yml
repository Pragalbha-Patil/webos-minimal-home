name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build-and-release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Verify version and package checked outputs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tools/package.py --tag "$RELEASE_TAG"
          test -f "docs/releases/$RELEASE_TAG.md"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/minimal-home-*.tar.gz
            dist/minimal-home-*.tar.gz.sha256
            dist/org.minimal.home_*.ipk
            dist/org.minimal.home_*.ipk.sha256
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ github.ref_name }}.md
