name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build-and-release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Verify version and package checked outputs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tools/package.py --tag "$RELEASE_TAG"
          test -f "docs/releases/$RELEASE_TAG.md"
      - uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          files: |
            dist/minimal-home-*.tar.gz
            dist/minimal-home-*.tar.gz.sha256
            dist/org.minimal.home_*.ipk
            dist/org.minimal.home_*.ipk.sha256
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ github.ref_name }}.md
